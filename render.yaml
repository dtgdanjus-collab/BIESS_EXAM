# Blueprint de Render: crea las 4 piezas del sistema en el plan gratuito.
# Render → New → Blueprint → elegir este repositorio.
# Si Render asigna URLs distintas (p. ej. con sufijo), actualizar CORS_ORIGINS,
# FRONTEND_URL y VITE_API_URL con las URLs reales y volver a desplegar.

databases:
  - name: biess-db
    plan: free
    databaseName: biess_postulacion
    user: biess

services:
  - type: keyvalue
    name: biess-redis
    plan: free
    ipAllowList: [] # solo conexiones internas de Render

  - type: web
    name: biess-api
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -tags netgo -ldflags '-s -w' -o app ./cmd/api
    startCommand: ./app
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biess-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: biess-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://biess-web.onrender.com
      - key: FRONTEND_URL
        value: https://biess-web.onrender.com

  - type: web
    name: biess-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://biess-api.onrender.com/api
    routes:
      # SPA: cualquier ruta (/login, /formulario…) sirve index.html
      - type: rewrite
        source: /*
        destination: /index.html
